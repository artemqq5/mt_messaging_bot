services:
  team-group-bot:
    build: .
    image: artemqq5/team-group-bot:latest
    container_name: team-group-bot
    env_file: .env
    entrypoint: ["sh", "/entrypoint.sh"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8019:8019"
    volumes:
      - ./logs:/app/logs
      - ./entrypoint.sh:/entrypoint.sh
    networks:
      - nginx-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  nginx-network:
    external: true
